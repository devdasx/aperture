# Revyl CLI Configuration
# Generated by: revyl init
# Edit these settings or run: revyl config set <key> <value>
# Docs: https://docs.revyl.ai/cli/hot-reload

project:
    name: uniapp
build:
    system: Xcode
    command: xcodebuild -project UniApp.xcodeproj -scheme UniApp -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build
    output: build/Build/Products/Debug-iphonesimulator/*.app
    platforms:
        ios:
            command: xcodebuild -project UniApp.xcodeproj -scheme UniApp -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build
            output: build/Build/Products/Debug-iphonesimulator/*.app
            app_id: 7b3ba894-a1fa-49cf-8637-e9362d7ded45
defaults:
    open_browser: true
    timeout: 1800
