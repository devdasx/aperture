<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aperture — Splash Screen</title>
<style>
  :root{
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:#e9eaee;font-family:var(--font);-webkit-font-smoothing:antialiased;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:48px 24px;gap:34px;
  }
  .head{text-align:center;}
  .head .eyebrow{font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#86868b;margin:0 0 8px;}
  .head h1{font-size:26px;font-weight:600;letter-spacing:-.02em;color:#1d1d1f;margin:0;}

  /* ---------- device ---------- */
  .device{
    width:330px;height:710px;border-radius:56px;padding:13px;position:relative;
    background:linear-gradient(155deg,#3a3d44,#15171c 60%);
    box-shadow:0 50px 100px -30px rgba(0,0,0,.55), 0 0 0 2px #0a0b0e, inset 0 0 0 2px rgba(255,255,255,.06);
    flex:0 0 auto;
  }
  .screen{
    position:relative;width:100%;height:100%;border-radius:44px;overflow:hidden;
    display:flex;align-items:center;justify-content:center;transition:background .4s ease;
  }
  /* themes — brand is BLACK */
  .screen.black{background:radial-gradient(125% 80% at 50% 38%, #1a1c21 0%, #000000 64%);}
  .screen.light{background:radial-gradient(125% 80% at 50% 38%, #ffffff 0%, #eef0f4 72%);}

  .island{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:104px;height:30px;border-radius:18px;background:#000;z-index:6;opacity:.92;}
  .screen.light .island{opacity:1;}

  .status{position:absolute;top:15px;left:0;right:0;display:flex;justify-content:space-between;padding:0 30px;font-size:13px;font-weight:600;z-index:5;}
  .status .r{display:flex;gap:6px;align-items:center;}
  .screen.light .status{color:#0b0d11;}
  .screen.black .status{color:#fff;}

  /* glow behind mark — neutral, monochrome */
  .glow{position:absolute;width:340px;height:340px;border-radius:50%;filter:blur(48px);opacity:0;z-index:1;transform:translateY(-26px) scale(.6);}
  .screen.black .glow{background:radial-gradient(circle,rgba(255,255,255,.14) 0%,rgba(255,255,255,0) 70%);}
  .screen.light .glow{background:radial-gradient(circle,rgba(10,12,20,.08) 0%,rgba(10,12,20,0) 70%);}

  .lockup{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:30px;transform:translateY(-22px);}
  .markwrap{opacity:0;will-change:transform,opacity;}
  .markwrap svg{display:block;width:118px;height:118px;}
  .screen.black .markwrap{filter:drop-shadow(0 14px 34px rgba(0,0,0,.5));}
  .screen.light .markwrap{filter:drop-shadow(0 14px 30px rgba(10,15,30,.16));}

  .wordwrap{overflow:hidden;}
  .word{font-size:42px;font-weight:600;letter-spacing:-.035em;line-height:1;transform:translateY(110%);will-change:transform;}
  .screen.black .word{color:#fff;}
  .screen.light .word{color:#0b0d11;}

  .tag{position:absolute;bottom:104px;left:0;right:0;text-align:center;font-size:13.5px;font-weight:500;letter-spacing:.02em;opacity:0;z-index:2;}
  .screen.black .tag{color:rgba(255,255,255,.5);}
  .screen.light .tag{color:rgba(11,13,17,.5);}

  .loader{position:absolute;bottom:64px;left:50%;transform:translateX(-50%);width:120px;height:3px;border-radius:3px;overflow:hidden;z-index:2;}
  .screen.black .loader{background:rgba(255,255,255,.16);}
  .screen.light .loader{background:rgba(11,13,17,.1);}
  .loader i{position:absolute;left:0;top:0;height:100%;width:0;border-radius:3px;}
  .screen.black .loader i{background:#fff;}
  .screen.light .loader i{background:#0b0d11;}

  /* ---- entrance animation (added via .play) ---- */
  .screen.play .glow{animation:glowIn 1.5s cubic-bezier(.2,.7,.2,1) .1s forwards;}
  .screen.play .markwrap{animation:markIn 1.0s cubic-bezier(.2,.8,.2,1) .15s forwards;}
  .screen.play .word{animation:wordRise .8s cubic-bezier(.2,.8,.2,1) .92s forwards;}
  .screen.play .tag{animation:fadeUp .7s ease 1.5s forwards;}
  .screen.play .loader i{animation:prog 2.0s cubic-bezier(.4,0,.2,1) .35s forwards;}

  @keyframes glowIn{0%{opacity:0;transform:translateY(-26px) scale(.5);}55%{opacity:.95;}100%{opacity:.6;transform:translateY(-26px) scale(1);}}
  @keyframes markIn{0%{opacity:0;transform:scale(.45) rotate(-95deg);}58%{opacity:1;transform:scale(1.09) rotate(7deg);}78%{transform:scale(.985) rotate(-1.5deg);}100%{opacity:1;transform:scale(1) rotate(0deg);}}
  @keyframes wordRise{0%{transform:translateY(110%);}100%{transform:translateY(0);}}
  @keyframes fadeUp{0%{opacity:0;transform:translateY(8px);}100%{opacity:1;transform:translateY(0);}}
  @keyframes prog{0%{width:0;}70%{width:82%;}100%{width:100%;}}

  /* settled end-state held explicitly */
  .screen.done .glow{opacity:.6;transform:translateY(-26px) scale(1);}
  .screen.done .markwrap{opacity:1;transform:none;}
  .screen.done .word{transform:none;}
  .screen.done .tag{opacity:1;transform:none;}
  .screen.done .loader i{width:100%;}

  /* ---------- controls ---------- */
  .controls{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center;}
  .seg{display:inline-flex;background:#fff;border:1px solid #dcdde1;border-radius:12px;padding:4px;gap:2px;}
  .seg button{border:0;background:transparent;font:inherit;font-size:14px;font-weight:550;color:#6e6e73;padding:8px 20px;border-radius:9px;cursor:pointer;transition:.18s;}
  .seg button.on{color:#fff;background:#1d1d1f;}
  .replay{display:inline-flex;align-items:center;gap:8px;border:1px solid #dcdde1;background:#fff;border-radius:12px;padding:10px 18px;font:inherit;font-size:14px;font-weight:600;color:#1d1d1f;cursor:pointer;transition:.15s;}
  .replay:hover{background:#f4f4f6;}
  .replay svg{width:16px;height:16px;}
  .note{font-size:12.5px;color:#86868b;text-align:center;max-width:340px;line-height:1.5;text-wrap:pretty;}
</style>
<link rel="stylesheet" href="iphone17.css">
</head>
<body>
  <div class="head">
    <p class="eyebrow">Aperture · Crypto Wallet</p>
    <h1>Splash Screen</h1>
  </div>

  <div class="device">
    <div class="island"></div>
    <div class="screen black play" id="screen">
      <div class="status">
        <span>9:41</span>
        <span class="r">
          <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="4.5" width="3" height="7.5" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1" opacity="0.4"/></svg>
          <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><path d="M8.5 2.5c2.3 0 4.4.9 6 2.4l1.2-1.3C13.8 1.7 11.3.7 8.5.7S3.2 1.7 1.3 3.6L2.5 4.9c1.6-1.5 3.7-2.4 6-2.4z"/><path d="M8.5 6c1.2 0 2.3.5 3.1 1.3l1.2-1.3C11.7 4.8 10.2 4.1 8.5 4.1S5.3 4.8 4.2 6l1.2 1.3C6.2 6.5 7.3 6 8.5 6z"/><circle cx="8.5" cy="9.7" r="1.6"/></svg>
          <svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x="1" y="1" width="21" height="10" rx="3" stroke="currentColor" stroke-opacity="0.5"/><rect x="3" y="3" width="16" height="6" rx="1.5" fill="currentColor"/><rect x="23" y="4" width="2" height="4" rx="1" fill="currentColor" fill-opacity="0.5"/></svg>
        </span>
      </div>

      <div class="glow"></div>
      <div class="lockup">
        <div class="markwrap" id="markwrap"></div>
        <div class="wordwrap"><div class="word">Aperture</div></div>
      </div>
      <div class="tag">Your keys. Your crypto.</div>
      <div class="loader"><i></i></div>
    </div>
  </div>

  <div class="controls">
    <div class="seg" id="themeSeg">
      <button data-theme="black" class="on">Black</button>
      <button data-theme="light">Light</button>
    </div>
    <button class="replay" id="replay">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v4h4"/></svg>
      Replay
    </button>
  </div>
  <p class="note">Iris blooms in, then the wordmark rises into place — ~2.2s, settling on a held end-state. Brand is monochrome black / white.</p>

<script src="aperture-icon.js"></script>
<script>
  const screen=document.getElementById('screen');
  const markwrap=document.getElementById('markwrap');
  let theme='black', doneT=null;
  const MARKCOLOR={black:'#ffffff', light:'#0b0d11'};

  function renderMark(){ markwrap.innerHTML=APERTURE.mark(118, MARKCOLOR[theme]); }
  function play(){
    screen.classList.remove('play','done');
    void screen.offsetWidth;
    screen.classList.add('play');
    clearTimeout(doneT);
    doneT=setTimeout(()=>screen.classList.add('done'), 2500);
  }
  renderMark();

  document.getElementById('themeSeg').addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b)return;
    document.querySelectorAll('#themeSeg button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); theme=b.dataset.theme;
    screen.classList.remove('black','light'); screen.classList.add(theme);
    renderMark(); play();
  });
  document.getElementById('replay').addEventListener('click',play);
  window.addEventListener('load',()=>{ play(); });
</script>
</body>
</html>
